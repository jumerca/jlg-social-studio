name: JLG Final QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jlg-final-qa.yml'
      - 'qa/jlg-final-qa.mjs'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run JLG final QA
        run: node qa/jlg-final-qa.mjs
