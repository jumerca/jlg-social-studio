<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<meta name="application-name" content="JLG Creative">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JLG Creative">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="https://wxurfggrvyggqexvjpqi.supabase.co/functions/v1/jlg-creative?asset=favicon-64" sizes="64x64">
<link rel="apple-touch-icon" href="https://wxurfggrvyggqexvjpqi.supabase.co/functions/v1/jlg-creative?asset=apple-touch-icon">
<title>JLG Creative</title>
<style>
html,body{margin:0;min-height:100%;background:#f8f4ec;color:#102432;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.mark{width:74px;height:74px;border-radius:20px;background:#0d1b2a;color:#d9b76c;display:grid;place-items:center;margin:auto;font-weight:900;font-size:24px;box-shadow:0 20px 45px #0d1b2a22}
.boot h1{margin:18px 0 7px;font-family:Georgia,serif;font-weight:500}.boot p{color:#6b7881}.bar{width:170px;height:4px;background:#e4ddd0;border-radius:99px;overflow:hidden;margin:18px auto}.bar i{display:block;width:45%;height:100%;background:#c9a55c;border-radius:99px;animation:load 1.15s infinite ease-in-out}@keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(330%)}}
</style>
</head>
<body>
<div class="boot"><div><div class="mark">JLG</div><h1>JLG Creative</h1><p>Chargement de l’expérience…</p><div class="bar"><i></i></div></div></div>
<script>
const SOURCE="https://wxurfggrvyggqexvjpqi.supabase.co/functions/v1/jlg-creative";
function rewrite(html){
  html=html.replace(/href=["']\?asset=manifest["']/g,'href="./manifest.webmanifest"');
  html=html.replace(/(["'])\?asset=([a-zA-Z0-9_-]+)\1/g,(m,q,a)=>q+SOURCE+'?asset='+a+q);
  return html;
}
(async()=>{
  try{
    const r=await fetch(SOURCE+location.search,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    let html=rewrite(await r.text());
    document.open(); document.write(html); document.close();
  }catch(e){
    document.body.innerHTML='<div class="boot"><div><div class="mark">JLG</div><h1>JLG Creative</h1><p>Impossible de charger le site pour le moment.</p><button onclick="location.reload()" style="border:0;border-radius:12px;padding:12px 16px;background:#0d1b2a;color:white;font-weight:800">Réessayer</button></div></div>';
  }
})();
</script>
</body></html>
